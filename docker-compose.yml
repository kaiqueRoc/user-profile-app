version: '3.9'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./ops/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./ops/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  auth-service:
    build: ./packages/microservices-go/auth-service
    environment:
      DB_HOST: db
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_COST: ${BCRYPT_COST}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"

  profile-service:
    build: ./packages/microservices-go/profile-service
    environment:
      DB_HOST: db
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8082"

  post-service:
    build: ./packages/microservices-go/post-service
    environment:
      DB_HOST: db
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8083:8083"

  api-node:
    build: ./packages/api-node
    environment:
      PORT: ${API_NODE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
      POST_SERVICE_URL: ${POST_SERVICE_URL}
      CORS_ORIGIN: http://localhost:${NEXT_PORT}
    depends_on:
      - auth-service
      - profile-service
      - post-service
    ports:
      - "3001:${API_NODE_PORT}"

  frontend-nextjs:
    build:
      context: ./packages/frontend-nextjs
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      version: '3.9'
      services:
        db:
          image: postgres:15
          restart: unless-stopped
          environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
          ports:
            - "5432:5432"
          volumes:
            - db_data:/var/lib/postgresql/data
            - ./ops/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

        redis:
          image: redis:7
          restart: unless-stopped
          ports:
            - "6379:6379"
          volumes:
            - redis_data:/data
          command: ["redis-server", "--appendonly", "yes"]

        auth-service:
          build: ./packages/microservices-go/auth-service
          environment:
            DB_HOST: db
            DB_PORT: ${POSTGRES_PORT}
            DB_USER: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            DB_NAME: ${POSTGRES_DB}
            JWT_SECRET: ${JWT_SECRET}
            BCRYPT_COST: ${BCRYPT_COST}
          depends_on:
            db:
              condition: service_healthy
          ports:
            - "8081:8081"

        profile-service:
          build: ./packages/microservices-go/profile-service
          environment:
            DB_HOST: db
            DB_PORT: ${POSTGRES_PORT}
            DB_USER: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            DB_NAME: ${POSTGRES_DB}
            JWT_SECRET: ${JWT_SECRET}
          depends_on:
            db:
              condition: service_healthy
          ports:
            - "8082:8082"

        post-service:
          build: ./packages/microservices-go/post-service
          environment:
            DB_HOST: db
            DB_PORT: ${POSTGRES_PORT}
            DB_USER: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            DB_NAME: ${POSTGRES_DB}
            REDIS_HOST: redis
            REDIS_PORT: ${REDIS_PORT}
            JWT_SECRET: ${JWT_SECRET}
          depends_on:
            db:
              condition: service_healthy
            redis:
              condition: service_started
          ports:
            - "8083:8083"

        api-node:
          build: ./packages/api-node
          environment:
            PORT: ${API_NODE_PORT}
            JWT_SECRET: ${JWT_SECRET}
            AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
            PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
            POST_SERVICE_URL: ${POST_SERVICE_URL}
            CORS_ORIGIN: http://localhost:${NEXT_PORT}
          depends_on:
            - auth-service
            - profile-service
            - post-service
          ports:
            - "3001:${API_NODE_PORT}"

        frontend-nextjs:
          build:
            context: ./packages/frontend-nextjs
            args:
              NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
          environment:
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
            NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
            PORT: ${NEXT_PORT}
          depends_on:
            - api-node
          ports:
            - "3000:${NEXT_PORT}"

      volumes:
        db_data: {}
        redis_data: {}
