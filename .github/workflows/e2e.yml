name: E2E Smoke

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v2

      - name: Start services
        run: |
          docker-compose up -d --build

      - name: Wait for DB
        run: |
          for i in {1..30}; do docker-compose exec -T db pg_isready && break || sleep 2; done

      - name: Run E2E script
        run: |
          chmod +x ./scripts/e2e.sh
          ./scripts/e2e.sh

      - name: Tear down
        if: always()
        run: docker-compose down -v
